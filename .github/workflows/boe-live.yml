name: Live official BOE verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'custom_components/tur_gas_boe/boe.py'
      - 'tests/boe_live_probe.py'
      - '.github/workflows/boe-live.yml'

permissions:
  contents: read

jobs:
  official-source:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install safe XML parser
        run: python -m pip install defusedxml==0.7.1
      - name: Fetch real official BOE XML and API indices
        run: python tests/boe_live_probe.py
