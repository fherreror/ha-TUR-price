name: Python checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install defusedxml==0.7.1 ruff==0.13.2 bandit==1.8.6
      - run: python -m compileall -q custom_components tests
      - run: ruff check --select E4,E7,E9,F custom_components tests
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: bandit -r custom_components -ll -q
