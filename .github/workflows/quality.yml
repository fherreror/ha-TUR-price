name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install validation tools
        run: python -m pip install defusedxml==0.7.1 ruff==0.13.2 bandit==1.8.6
      - name: Compile Python sources
        run: python -m compileall -q custom_components tests
      - name: Lint for errors
        run: ruff check --select E4,E7,E9,F custom_components tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Bandit security review
        run: bandit -r custom_components -ll -q
